name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: version to stamp into the build, e.g. 0.1.0-alpha.1
        default: 0.0.0-dev

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build
      - run: dotnet run --project src/Umsatzschätzung.E2e

  msi:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win-x64
          - os: windows-11-arm
            arch: win-arm64
    runs-on: ${{ matrix.os }}
    env:
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # v7 gates builds behind the Open Source Maintenance Fee EULA; v6 does not
      # and reads the same v4 schema the .wxs uses.
      - run: dotnet tool install --global wix --version 6.0.2
      - name: restore signing certificate
        if: env.PFX_BASE64 != ''
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\publisher.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          "PFX=$env:RUNNER_TEMP\publisher.pfx" >> $env:GITHUB_ENV
        shell: pwsh
      - run: pwsh packaging/windows/build.ps1 -Version ${{ inputs.version || github.ref_name }} -Arch ${{ matrix.arch }} -Pfx "$env:PFX"
        env:
          UMSATZ_PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: umsatzschätzung-${{ matrix.arch }}-msi
          path: |
            dist/msi/*.msi
            dist/msi/*.cab
            dist/msi/publisher.cer
            dist/msi/SHA256SUMS.txt

  release:
    needs: msi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: umsatzschätzung-*-msi
          path: artifacts

      # The per-arch SHA256SUMS.txt files would collide on merge, so the sums
      # are recomputed here over the combined asset set instead.
      - name: collect assets
        run: |
          mkdir release
          find artifacts -type f \( -name '*.msi' -o -name '*.cab' -o -name 'publisher.cer' \) \
            -exec cp {} release/ \;
          test -n "$(find release -name '*.msi' -print -quit)" || { echo "no msi in artifacts:"; find artifacts -type f; exit 1; }
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
