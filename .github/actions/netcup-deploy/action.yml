name: netcup-deploy
description: Ship a built directory into an existing netcup document root over SSH.

inputs:
  source:
    required: true
  deploy-path:
    required: true
  host:
    required: true
  user:
    required: true
  key:
    required: true
  known-hosts:
    required: true
  keep:
    description: Directories below the document root, as shell globs, that never change once there; the previous deploy's copy stays unless the new one brings its own.
    required: false
    default: ''
  create:
    description: Create the deploy path when it is not there yet, for a folder inside another deploy that keeps it.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SSH_KEY: ${{ inputs.key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SSH_TARGET: ${{ inputs.user }}@${{ inputs.host }}
        DEPLOY_PATH: ${{ inputs.deploy-path }}
        SOURCE: ${{ inputs.source }}
        KEEP: ${{ inputs.keep }}
        CREATE: ${{ inputs.create }}
      run: |
        set -euo pipefail

        case "$DEPLOY_PATH" in
          ''|/*|*..*) echo "refusing deploy path '$DEPLOY_PATH'" >&2; exit 1 ;;
        esac

        mkdir -p -m 700 ~/.ssh
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        SSH_OPTS=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)

        EXCLUDE=(--exclude='./.git')
        if [ -n "$KEEP" ]; then
          while read -r present; do
            [ -n "$present" ] && EXCLUDE+=(--exclude="./$present")
          done < <(ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "cd '$DEPLOY_PATH' && for d in $KEEP; do [ -d \"\$d\" ] && echo \"\$d\"; done; true")
        fi

        STAGE="$(dirname "$DEPLOY_PATH")/.deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        tar -czf - "${EXCLUDE[@]}" -C "$SOURCE" . | ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "
          set -e
          [ '$CREATE' = true ] && mkdir -p '$DEPLOY_PATH'
          [ -d '$DEPLOY_PATH' ] || { echo 'missing $DEPLOY_PATH' >&2; exit 1; }
          rm -rf '$STAGE' && mkdir -p '$STAGE/new' '$STAGE/old'
          tar -xzf - -C '$STAGE/new'
          find '$DEPLOY_PATH' -mindepth 1 -maxdepth 1 -exec mv -t '$STAGE/old' {} +
          cd '$STAGE/old'
          for kept in $KEEP; do
            [ -d \"\$kept\" ] && [ ! -e \"../new/\$kept\" ] && mkdir -p \"../new/\$(dirname \"\$kept\")\" && mv \"\$kept\" \"../new/\$kept\"
          done
          cd - >/dev/null
          find '$STAGE/new' -mindepth 1 -maxdepth 1 -exec mv -t '$DEPLOY_PATH' {} +
          rm -rf '$STAGE'
        "
