version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      avalonia:
        patterns: ["Avalonia*"]
      skiasharp:
        patterns: ["SkiaSharp*"]
      pdfium:
        patterns: ["bblanchon.PDFium*"]
      onnxruntime:
        patterns: ["Microsoft.ML.OnnxRuntime*"]
    ignore:
      # Avalonia 12 is built against SkiaSharp 3; lift once Avalonia moves to 4.
      - dependency-name: "SkiaSharp*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /web/landing
    schedule:
      interval: monthly
    groups:
      landing:
        patterns: ["*"]
