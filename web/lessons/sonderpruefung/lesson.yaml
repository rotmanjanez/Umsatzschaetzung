title: Eine zweite Prüfung

guide:
  page: web/docs/pages/guide/sonderpruefung.md
  title: Eine zweite Prüfung
  intro: |-
    <p class="us-steps"><span class="here">Zweite Prüfung</span><a href="../regeln/">Regeln</a><a href="../kette/">Kette</a><a href="../warenarten/">Warenarten</a><a href="../produkte/">Produkte</a><a href="../ertragsregeln/">Ertragsregeln</a></p>

    Was die Regeln können, zeigt sich erst an der nächsten Prüfung. Für dieses Kapitel
    bekommt das Gasthaus Zur Linde deshalb eine zweite: eine Umsatzsteuer-Sonderprüfung
    für Mai bis Juli 2025, mit den 26 Rechnungen aus diesen drei Monaten.
  end: |-
    !!! geschafft "Geschafft, wenn …"
        - die Liste zwei Prüfungen des Gasthauses zeigt
        - die Sonderprüfung auf **1. Rechnungen** 26 Rechnungen hält und auf
          **3. Sortiment** **Bier 0,5 l vom Fass** mit `4,60`

    !!! nachlesen "Zum Nachlesen"
        Die Liste der Prüfungen beschreibt [Prüfungen](../pruefungen.md), wo die Regeln
        liegen und wer sie teilt [Verwaltete Installation](../verwaltung.md#regel-datenbank).

    [Weiter: Regeln pflegen <span>Was das Programm aus der ersten Prüfung behalten hat</span>](regeln.md){ .us-next }

chapters:
  - title: Anlegen
    beats:
      - act:
          - { do: click, at: { name: NewCase } }
          - { do: focus }
          - { do: type, at: { name: NewLabel }, text: "Gasthaus Zur Linde, USt-Sonderprüfung 2025" }
          - { do: type, at: { name: NewFrom }, text: "01.05.2025" }
          - { do: type, at: { name: NewTo }, text: "31.07.2025" }
          - { do: type, at: { name: NewName }, text: "Renate Vogel" }
          - { do: type, at: { name: NewTaxNumber }, text: "123/456/789" }
          - { do: type, at: { name: NewPab }, text: "PAB 2025/0611" }
          - { do: focus }
          - { do: click, at: { text: "Anlegen" } }

