  - title: Sortiment
    beats:
      - act:
          - { do: tab, header: "3. Sortiment" }
          - { do: choose, at: { name: CatalogBox }, text: "Bier 0,5", item: "Bier 0,5 l vom Fass" }
          - { do: edit, at: { text: "Bier 0,5 l vom Fass" }, column: Bruttopreis, text: "4,60" }
          - { do: focus }

  - title: Zwei Prüfungen
    beats:
      - act:
          - { do: click, at: { name: BackButton } }
          - { do: deselect, at: { text: "Bezeichnung", up: DataGrid } }
        rounds: 2
        text: |-
          Angelegt wird sie wie die erste unter [Prüfung anlegen](start.md): Bezeichnung
          `Gasthaus Zur Linde, USt-Sonderprüfung 2025`, Zeitraum `01.05.2025` bis
          `31.07.2025`, Name `Renate Vogel` und Steuernummer `123/456/789` wie gehabt,
          PAB-Nr. `PAB 2025/0611`. Auf **1. Rechnungen** kommen aus dem Ordner
          `beispiel-rechnungen-2025` die 26 Dateien, deren Name mit `2025-05`, `2025-06`
          oder `2025-07` beginnt. Auf **3. Sortiment** kommt **Bier 0,5 l vom Fass** mit
          `4,60` wie in der ersten. Einen erklärten Umsatz braucht es nicht. Zurück in
          der Liste stehen beide Prüfungen:
        shot:
          name: sonderpruefung-liste
          at: { text: "Bezeichnung", up: DataGrid }
          trim: { top: 16 }
          clip: DataGridRow
          alt: Die Liste der Prüfungen mit beiden Prüfungen des Gasthauses
