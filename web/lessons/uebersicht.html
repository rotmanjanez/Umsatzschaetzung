<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übungen</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Sora"; font-weight: 400; src: url(fonts/sora-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Sora"; font-weight: 600; src: url(fonts/sora-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Sora"; font-weight: 700; src: url(fonts/sora-latin-700-normal.woff2) format("woff2"); }

:root { --paper: #eef2fa; --ink: #0e1629; --muted: #56627d; --rule: #cfd7e8; --blue: #2f63d8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0e1629; --ink: #eef2fa; --muted: #8a97b3; --rule: #2c3d63; --blue: #6e97f2; }
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 "Sora", system-ui, sans-serif; }
main { width: min(640px, 100%); margin: 0 auto; padding: 40px 16px; }
a { color: var(--blue); }
a:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

header { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.1; }
header img { width: 132px; height: auto; }

section { margin-top: 28px; }
h2 { margin: 0 0 6px; color: var(--blue); font-size: .85rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
li a { display: flex; gap: 16px; align-items: baseline; padding: 14px 4px; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; font-weight: 600; }
li a:hover { color: var(--blue); }
li span { min-width: 1.2em; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }

footer { margin-top: 40px; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Übungen</h1>
    <img src="didi.png" alt="Didi, ein Dachs in Hemd und Krawatte">
  </header>
{courses}
  <footer>Didi hat <a href="https://bichmann.net">Maxie Bichmann</a> gezeichnet.</footer>
</main>
</body>
</html>
