<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Übungen · {course}</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Sora"; font-weight: 400; src: url(fonts/sora-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Sora"; font-weight: 600; src: url(fonts/sora-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Sora"; font-weight: 700; src: url(fonts/sora-latin-700-normal.woff2) format("woff2"); }

:root { --paper: #eef2fa; --card: #fbfcfe; --ink: #0e1629; --muted: #56627d; --rule: #cfd7e8; --blue: #2f63d8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0e1629; --card: #1b2a4d; --ink: #eef2fa; --muted: #8a97b3; --rule: #2c3d63; --blue: #6e97f2; }
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 "Sora", system-ui, sans-serif; }
main { width: min(900px, 100%); margin: 0 auto; padding: 48px 16px 32px; }
a { color: var(--blue); }
a:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; border-radius: 12px; }

header { display: flex; align-items: center; gap: 32px; margin-bottom: 40px; }
header div { flex: 1; }
header img { width: min(240px, 34%); height: auto; }
.kicker { margin: 0; color: var(--blue); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: .9rem; }
h1 { margin: .3rem 0 .8rem; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.15; }
header p:last-child { margin: 0; color: var(--muted); }

ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
ol a { display: block; padding: 20px 24px; border: 1px solid var(--rule); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; }
ol a:hover { border-color: var(--blue); }
ol .kicker { font-size: .8rem; }
h2 { margin: .2rem 0 .4rem; font-size: 1.3rem; }
ol p { margin: 0; color: var(--muted); }

footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }

@media (max-width: 560px) {
  header { flex-direction: column-reverse; align-items: flex-start; gap: 16px; }
  header img { width: 160px; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p class="kicker">{course}</p>
      <h1>Übungen</h1>
      <p>Didi erklärt das Programm, und Sie klicken selbst mit. Jede Übung dauert nur ein paar Minuten, am besten nehmen Sie sie der Reihe nach.</p>
    </div>
    <img src="didi.png" alt="Didi, ein Dachs in Hemd und Krawatte">
  </header>
  <ol>
{lessons}
  </ol>
  <footer>Didi hat <a href="https://bichmann.net">Maxie Bichmann</a> gezeichnet.</footer>
</main>
</body>
</html>
