course: Umsatzschätzung Schritt für Schritt
number: 5
title: Die Kalkulation
summary: >-
  Bevor das Ergebnis zählt, wird aufgeräumt: Einkäufe, die in kein Rezept eingehen,
  und solche, die gar keinen Umsatz bringen. Danach, am Schnitzel, wie aus Einkauf,
  Rezept und Preis der Umsatz wird.
window: [1440, 810]

done:
  title: Geschafft!
  text: >-
    Das Schnitzelfleisch zählt jetzt zum Schnitzel, was keinen Umsatz bringt, ist
    aussortiert, und du weißt, wie aus dem Einkauf der Umsatz wird.

guide:
  page: web/docs/pages/guide/kalkulation.md
  title: Kalkulation
  intro: |-
    <p class="us-steps"><a href="../start/">Prüfung</a><a href="../rechnungen/">1. Rechnungen</a><a href="../zuordnung/">2. Zuordnung</a><a href="../sortiment/">3. Sortiment</a><span class="here">4. Kalkulation</span><a href="../bericht/">5. Bericht</a></p>

    Die Kalkulation rechnet aus dem Einkauf, den Rezepten und den Preisen den
    Umsatz. Was dabei nicht über Rezept und Preis hineinfindet, steht gesondert
    auf der Seite **Übrige Einkäufe**. Bevor das Ergebnis zählt, wird dort
    aufgeräumt.
  end: |-
    !!! nachlesen "Zum Nachlesen"
        Den Rechenweg vom Einkauf über Ertragsregeln, Rezepte und Preise zum Umsatz
        und die Seite **Übrige Einkäufe** im Einzelnen beschreibt
        [Kalkulation](../kalkulation.md#nicht-berucksichtigt).

    [Weiter: 5. Bericht <span>Das Ergebnis als PDF</span>](bericht.md){ .us-next }

chapters:
  - title: Übrige Einkäufe
    beats:
      - card:
          kicker: Umsatzschätzung · Übung 5
          title: Die Kalkulation
          text: Ein paar Minuten zum Mitklicken.
        say: >-
          Servus! In dieser Übung räumen wir zuerst auf, die Einkäufe, die in kein
          Rezept hineinpassen. Und dann schauen wir am Schnitzel, wie das Programm den
          Umsatz rechnet. Klicken darfst du wieder selbst.
      - card:
          kicker: Worum geht es?
          title: Nicht jeder Einkauf wird ein Gericht
          text: Was in kein Rezept passt, steht unter „Übrige Einkäufe“.
        say: >-
          Das Programm rechnet den Umsatz über die Rezepte und die Preise aus. Nur
          passt nicht jeder Einkauf in ein Rezept. Manches ist eine Kleinigkeit,
          manches ist falsch zugeordnet, und manches verkauft das Gasthaus gar
          nicht, Servietten zum Beispiel. Das alles steht gesammelt auf einer
          eigenen Seite, und die schauen wir uns jetzt an.
      - say: >-
          Dafür wechseln wir oben auf den Reiter Kalkulation.
        click: { text: "4. Kalkulation", type: TabItem }
        act: [{ do: tab, header: "4. Kalkulation" }]
        rounds: 8
        task: Auf „4. Kalkulation“ klicken.
        hint: Die Reiter stehen oben, unter dem Namen des Gasthauses.
      - say: >-
          Darunter gibt es noch einmal kleinere Reiter. Wir nehmen Übrige Einkäufe.
        click: { text: "Übrige Einkäufe", type: TabItem }
        act: [{ do: tab, header: "Übrige Einkäufe" }]
        rounds: 4
        task: Auf „Übrige Einkäufe“ klicken.
        hint: Er steht in der zweiten Reihe, neben „Ertragsregeln“.
        text: |-
          Auf **4. Kalkulation** wechseln und die Seite **Übrige Einkäufe** öffnen.
          Sie zeigt die Einkäufe, die nicht über Rezeptur und Preis in den Umsatz
          eingehen, in zwei Listen mit dem Grund je Position:

          - **Nicht Teil der Ermittlung des Aufschlagsatzes**: Die Zutat kommt in
            keinem Produkt des Sortiments vor, oder der Zuordnung fehlt der Faktor.
            Ihr Umsatz wird über den Rohgewinnaufschlagsatz geschätzt. Meist ist das
            in Ordnung: Kleinigkeiten, für die sich kein eigenes Produkt lohnt, oder
            Zutaten, die ein Rezept nicht aufs Gramm genau abbildet.
          - **Nicht in der Umsatzschätzung**: Einkäufe, die keinen Umsatz bringen,
            etwa Putzmittel oder Servietten. Auf sie wird kein Gewinn ermittelt.

          Ein Klick auf eine Zeile öffnet rechts die Zuordnung der Position; eine
          falsche Zuordnung lässt sich dort direkt korrigieren. Pfand und Leergut
          stehen nicht in den Listen, sie gleichen sich über die Zeit aus.
      - say: >-
          In der oberen Liste stehen die Einkäufe, die in kein Rezept eingehen. Auf
          die schätzt das Programm den Umsatz halt pauschal, über den
          Rohgewinnaufschlagsatz. Bei ein paar Kleinigkeiten passt das.
        show: { name: UnusedGrid }

  - title: Das Schnitzel
    beats:
      - say: >-
          Ganz oben steht aber das Schweineschnitzel, mit fast dreitausendfünfhundert
          Euro. Das ist keine Kleinigkeit. Einmal draufklicken.
        click: { starts: "Schweineschnitzel natur" }
        via: select
        allow: [{ starts: "Schweineschnitzel natur", up: DataGridRow }]
        rounds: 8
        task: Auf „Schweineschnitzel natur, ausgelöst“ klicken.
        hint: Es ist die erste Zeile der oberen Liste.
        text: |-
          In **Nicht Teil der Ermittlung des Aufschlagsatzes** steht ganz oben
          **Schweineschnitzel natur, ausgelöst**, mit fast 3.500 € netto. Das
          Programm hat es als **Schnitzel, paniert, je Stück** zugeordnet, als
          fertig paniertes Schnitzel. Das Gasthaus kauft das Fleisch aber roh,
          427 kg im Jahr, und paniert selbst; im Sortiment steht **Schnitzel mit
          Pommes**, und dessen Rezept rechnet mit Schweinefleisch.
      - say: >-
          Rechts sieht man, was das Programm daraus gemacht hat: ein fertig
          paniertes Schnitzel, je Stück. Das Gasthaus kauft aber das rohe Fleisch,
          über vierhundert Kilo im Jahr, und paniert selbst. Darum findet der
          Einkauf kein Gericht.
        show: { name: MappingPane }
      - say: >-
          Gleich darunter schlägt das Programm Schweinefleisch vor, und daneben
          steht In Rezeptur. Das heißt, ein Gericht aus unserem Sortiment braucht
          es, hier das Schnitzel mit Pommes. Das nehmen wir.
        click: { text: "Schweinefleisch", up: RadioButton }
        rounds: 4
        task: Auf „Schweinefleisch“ klicken.
        hint: Es ist der zweite Vorschlag rechts, der mit „In Rezeptur“.
        text: |-
          Rechts steht die Zuordnung, darunter die Vorschläge. **Schweinefleisch**
          trägt das Zeichen **In Rezeptur**: Ein Produkt des Sortiments braucht die
          Zutat, hier **Schnitzel mit Pommes**. Den Vorschlag wählen und
          **Zuordnen**.
        shot:
          name: kalkulation-schnitzel
          at: { name: MappingPane }
          alt: Das Schnitzel wird Schweinefleisch zugeordnet
      - say: >-
          Passt, also auf Zuordnen.
        click: { text: "Zuordnen" }
        done: { at: { starts: "„Schweineschnitzel" } }
        rounds: 8
        task: Auf „Zuordnen“ klicken.
        text: |-
          Die Position verschwindet aus der Liste und zählt ab jetzt zum Schnitzel.
      - say: >-
          Die Zeile ist weg, das Fleisch zählt jetzt zum Schnitzel. Das ist
          übrigens die gleiche Zuordnung wie in der dritten Übung, nur von einer
          anderen Stelle aus, und auch sie landet in der Regel-Datenbank. Die
          nächste Prüfung weiß es also schon.
        hold: 0.5
        text: |-
          Die automatische Zuordnung liegt meistens richtig. Wo nicht, fällt es hier
          als großer Betrag auf. Wie auf
          [2. Zuordnung](zuordnung.md) merkt sich das Programm die Zuordnung in der
          [Regel-Datenbank](../verwaltung.md#regel-datenbank).

  - title: Was keinen Umsatz bringt
    beats:
      - say: >-
          In derselben Liste stehen auch Sachen, die das Gasthaus braucht, aber
          nicht verkauft. Bleiben die da stehen, schätzt das Programm auch auf sie
          einen Umsatz, und das wäre falsch. Am Ende jeder Zeile gibt es dafür ein
          kleines Kreuz.
        show: { starts: "Servietten 1/4 Falz", up: DataGridRow }
        text: |-
          In derselben Liste stehen Einkäufe, die der Betrieb braucht, aber nicht
          verkauft. Bleiben sie dort, schätzt das Programm auch auf sie einen Umsatz
          über den Rohgewinnaufschlagsatz. Bei diesen Positionen auf das Kreuz am
          Zeilenende klicken (**… bringt in diesem Betrieb keinen Umsatz**):

          1. **Servietten 1/4 Falz 33 × 33 cm weiß 1000 St.**
          2. **CO2-Flasche 10 kg Füllung**
          3. **Handspülmittel Konzentrat 5 l**
          4. **Versandkostenpauschale**
      - say: >-
          Fangen wir mit den Servietten an. Aufs Kreuz ganz rechts in der Zeile
          klicken.
        click: { starts: "Servietten 1/4 Falz", up: DataGridRow }
        allow: [{ tip: "„Verpackung und Einweg“ bringt in diesem Betrieb keinen Umsatz" }]
        done: { at: { tip: "„Verpackung und Einweg“ bringt doch Umsatz" } }
        rounds: 4
        task: Kreuz bei „Servietten 1/4 Falz“ klicken.
        hint: Das Kreuz steht ganz rechts in der Zeile, neben dem Betrag.
      - say: >-
          Die Servietten sind nach unten gewandert, und zwei andere Zeilen gleich
          mit: die Müllbeutel und das Filterpapier für den Kaffee. Die hat das
          Programm alle derselben Zutat zugeordnet, nämlich Verpackung und Einweg.
          Und das Kreuz gilt für die ganze Zutat, nicht nur für die eine Zeile.
        show: { name: OmittedGrid }
      - say: >-
          Als Nächstes die Kohlensäure für die Schankanlage, die CO2-Flasche.
          Wieder aufs Kreuz.
        click: { starts: "CO2-Flasche", up: DataGridRow }
        allow: [{ tip: "„Ausstattung und Bedarf“ bringt in diesem Betrieb keinen Umsatz" }]
        done: { at: { tip: "„Ausstattung und Bedarf“ bringt doch Umsatz" } }
        rounds: 4
        task: Kreuz bei „CO2-Flasche“ klicken.
        hint: Das Kreuz steht ganz rechts in der Zeile.
      - say: >-
          Dann das Handspülmittel.
        click: { starts: "Handspülmittel Konzentrat", up: DataGridRow }
        allow: [{ tip: "„Reinigung und Hygiene“ bringt in diesem Betrieb keinen Umsatz" }]
        done: { at: { tip: "„Reinigung und Hygiene“ bringt doch Umsatz" } }
        rounds: 4
        task: Kreuz bei „Handspülmittel“ klicken.
        hint: Das Kreuz steht ganz rechts in der Zeile.
      - say: >-
          Und zum Schluss die Versandkostenpauschale. Fracht verkauft ja auch
          niemand.
        click: { starts: "Versandkostenpauschale", up: DataGridRow }
        allow: [{ tip: "„Dienstleistung und Fracht“ bringt in diesem Betrieb keinen Umsatz" }]
        done: { at: { tip: "„Dienstleistung und Fracht“ bringt doch Umsatz" } }
        rounds: 4
        task: Kreuz bei „Versandkostenpauschale“ klicken.
        hint: Das Kreuz steht ganz rechts in der Zeile.
        text: |-
          Die Festlegung gilt für die Zutat, nicht nur für die angeklickte Position.
          Alle Positionen derselben Zutat wandern mit: mit den Servietten
          (**Verpackung und Einweg**) auch Müllbeutel und Filterpapier, mit dem
          Handspülmittel (**Reinigung und Hygiene**) Spülmaschinen-Reiniger,
          Klarspüler, Handtuchrollen und Handschuhe, mit der Versandkostenpauschale
          (**Dienstleistung und Fracht**) die Leihgebühr der Thermobox. Sie stehen danach unter **Nicht in der
          Umsatzschätzung**, und auf sie wird kein Gewinn ermittelt. Das Symbol dort
          nimmt die Festlegung wieder zurück.
        shot:
          name: kalkulation-ohne-umsatz
          at: { name: OmittedGrid, up: Grid }
          trim: { top: -40 }
          below: true
          alt: Was keinen Umsatz bringt, steht unter „Nicht in der Umsatzschätzung“
      - say: >-
          Unten steht jetzt alles, was keinen Umsatz bringt. Wer sich vertan hat:
          Das Symbol am Zeilenende holt eine Zutat wieder zurück.
        show: { name: OmittedGrid }
      - say: >-
          Oben bleiben gut viertausenddreihundert Euro, das sind keine sieben
          Prozent der Einkäufe. Lauter Kleinigkeiten, für die sich kein
          eigenes Gericht lohnt, und so darf das auch bleiben.
        show: { text: "Nicht Teil der Ermittlung des Aufschlagsatzes", up: DockPanel }
        hold: 0.5
        text: |-
          Übrig bleiben in der oberen Liste gut 4.300 €, 6,52 % der Einkäufe:
          Kleinigkeiten, für die sich kein eigenes Produkt lohnt.

          !!! geschafft "Geschafft, wenn …"
              - **Schweineschnitzel natur** nicht mehr in den Listen steht
              - Servietten, CO2, Handspülmittel und Versandkostenpauschale unter
                **Nicht in der Umsatzschätzung** stehen
              - neben **Nicht Teil der Ermittlung des Aufschlagsatzes** `4.350,66 €
                (6,52 % der Einkäufe)` steht

  - title: Vom Einkauf zum Umsatz
    beats:
      - say: >-
          Jetzt, wo das Fleisch beim Schnitzel ist, schauen wir uns an, wie das
          Programm daraus den Umsatz rechnet. Zuerst das, was hineingeht: das
          Sortiment. Klick oben auf den Reiter Sortiment.
        click: { text: "3. Sortiment", type: TabItem }
        act: [{ do: tab, header: "3. Sortiment" }]
        rounds: 8
        task: Auf „3. Sortiment“ klicken.
        hint: Die Reiter stehen oben, links neben „4. Kalkulation“.
        text: |-
          Wie das Programm rechnet, zeigt ein Produkt am besten. Auf **3. Sortiment**
          steht **Schnitzel mit Pommes** mit dem Preis von der Karte, 15,90 € brutto.
      - say: >-
          Da ist unser Schnitzel mit Pommes, um fünfzehn Euro neunzig, so wie es auf
          der Karte steht. Das ist der Preis. Das Rezept dazu kommt aus dem Katalog,
          und das Fleisch von den Rechnungen.
        show: { text: "Schnitzel mit Pommes", up: DataGridRow }
        hold: 0.5
      - say: >-
          Und jetzt schauen wir, was die Kalkulation daraus macht. Zurück auf den
          Reiter Kalkulation.
        click: { text: "4. Kalkulation", type: TabItem }
        act: [{ do: tab, header: "4. Kalkulation" }]
        rounds: 8
        task: Auf „4. Kalkulation“ klicken.
        hint: Die Reiter stehen oben, rechts neben „3. Sortiment“.
      - say: >-
          In der zweiten Reihe ganz links ist die Seite Portionen.
        click: { text: "Portionen", type: TabItem }
        act: [{ do: tab, header: "Portionen" }]
        rounds: 4
        task: Auf „Portionen“ klicken.
        hint: Sie steht in der zweiten Reihe ganz links.
      - say: >-
          Hier steht jedes Produkt aus dem Sortiment, mit seinen Portionen und dem
          Umsatz. Klick auf das Schnitzel mit Pommes.
        click: { text: "Schnitzel mit Pommes" }
        via: select
        allow: [{ text: "Schnitzel mit Pommes", up: DataGridRow }]
        rounds: 4
        task: Auf „Schnitzel mit Pommes“ klicken.
        hint: Es steht weiter unten in der Liste, nach dem Alphabet.
        text: |-
          Auf **4. Kalkulation** die Seite **Portionen** öffnen und **Schnitzel mit
          Pommes** anklicken. Rechts steht, wie es gerechnet ist:

          - **Rezeptur je Portion**: 180 g Schweinefleisch, dazu Pommes frites und
            Pflanzenöl. Beim Schweinefleisch steht **begrenzt die Portionen**: Es
            ist die Zutat, von der am wenigsten da ist.
          - **Portionen**: Das Schweinefleisch könnte auch in den Braten des
            Mittagstischs gehen. Die Kalkulation verteilt eine Zutat, die sich
            mehrere Produkte teilen, so, dass möglichst viel vom Einkauf aufgeht;
            das Schnitzel verbraucht mit Pommes und Öl mehr davon. So entfallen alle
            rund 547 kg auf das Schnitzel, bei 180 g je Stück 3.039 Portionen.
          - **Umsatz (netto)**: 3.039 Portionen zu 15,90 € brutto, ohne 19 %
            Umsatzsteuer, ergeben 40.601,04 €.

          So rechnet die Kalkulation jedes Produkt des Sortiments.
        shot:
          name: kalkulation-portionen
          at: { name: ProductGrid, up: Grid }
          alt: Die Seite „Portionen“ mit dem Schnitzel und seinem Rezept
      - say: >-
          Rechts steht das Rezept: hundertachtzig Gramm Schweinefleisch pro
          Schnitzel, dazu Pommes und Öl. Beim Schweinefleisch steht, begrenzt die
          Portionen. Das Fleisch bestimmt also, wie viele Schnitzel es werden.
        show: { text: "Schweinefleisch", up: StackPanel }
      - say: >-
          Das Schweinefleisch könnte auch in den Braten vom Mittagstisch gehen.
          Das Programm verteilt es aber so, dass möglichst viel vom Einkauf
          aufgeht, und zum Schnitzel gehören ja auch noch Pommes und Öl. Also geht
          das ganze Fleisch ins Schnitzel, rund fünfhundertsiebenundvierzig Kilo,
          und bei hundertachtzig Gramm pro Stück sind das dreitausendneununddreißig
          Schnitzel.
        show: { text: "Einsatz je Portion", up: ItemsControl }
      - say: >-
          Mal fünfzehn Euro neunzig sind das gut achtundvierzigtausenddreihundert
          Euro. Ohne die Umsatzsteuer bleiben gut vierzigtausendsechshundert Euro Umsatz,
          netto, allein mit dem Schnitzel.
        show: { text: "Einsatz je Portion", up: ItemsControl }
        hold: 0.5
      - say: >-
          Und genau so rechnet das Programm jedes Produkt im Sortiment. Alles
          zusammengezählt ist der Umsatz, den der Einkauf hergibt. Den schauen wir
          uns in der letzten Übung an.
        show: { name: ProductGrid }
        hold: 0.5

  - title: Ertragsregeln
    beats:
      - text: |-
          Auf der Seite **Ertragsregeln** stehen die Kategorien und Zutaten der
          Prüfung, für die es Ertragsregeln gibt, etwa für Schankverlust oder Bruch.
          Je Zutat oder Warengruppe lässt sich wählen, welche Regel gilt; die
          Kalkulation rechnet sofort neu. Für das Beispiel bleiben die
          Voreinstellungen.

  - title: Rezeptur anpassen
    beats:
      - text: |-
          Ein Klick auf ein Produkt unter **Portionen** öffnet rechts seine Details.
          Unter **Rezeptur je Portion** steht, was in eine Portion geht, und daneben,
          woher das Rezept kommt: **Katalog** oder **Nur diese Prüfung**.

          Passt ein Rezept nicht, gibt es zwei Wege:

          - **Im Katalog bearbeiten** öffnet die Regeln auf diesem Produkt. Die
            Änderung gilt für alle Prüfungen.
          - **Für diese Prüfung anpassen** kopiert das Rezept in die Prüfung. Der
            Katalog bleibt, wie er ist.

          Angepasst lassen sich die Zeilen bearbeiten: Zutat, Menge und Einheit,
          dazu fügt das Plus (**Zutat hinzufügen**) eine Zeile an. Weicht eine Zeile
          vom Katalog ab, steht grau daneben, was er vorsieht, etwa **Katalog:
          200 g**. Eine Zutat wird in jedem Rezept in derselben Einheit gemessen,
          auch im angepassten. Die Kalkulation rechnet bei jeder Änderung sofort
          neu; unter **Portionen** steht beim Produkt **angepasst**, auf
          **3. Sortiment** **Rezept angepasst**, und ein Klick darauf führt hierher.

          Der Bericht druckt das angepasste Rezept so, wie es gerechnet ist.

          Unten stehen zwei Schaltflächen:

          - **Auf Katalog zurücksetzen** verwirft die Anpassung.
          - **In den Katalog übernehmen** öffnet die Regeln mit dem angepassten
            Rezept. Ist es dort gespeichert, entfällt die Anpassung, und das Produkt
            steht wieder auf **Katalog**.

          Ändert sich das Katalogrezept später, übernimmt die Prüfung das nicht von
          selbst. Beim Produkt steht dann **Katalogrezept seit der Anpassung
          geändert**; ob die Anpassung bleibt oder zurückgesetzt wird, entscheidet
          der Prüfer.

          !!! tip "Faustregel"
              Ist das Rezept für jeden Betrieb falsch, den Katalog berichtigen.
              Weicht nur dieser Betrieb belegbar ab, etwa mit größeren Portionen oder
              einem anderen Salat, für die Prüfung anpassen.

          Für das Beispiel bleiben die Katalogrezepte.

  - title: Ergebnis
    beats:
      - text: |-
          Zum Schluss die letzte Seite, **Ergebnis**, öffnen: Umsätze vor und nach
          Betriebsprüfung, Rohgewinnaufschlag und Zusammenfassung. Jede Korrektur
          auf den anderen Seiten ist hier schon eingerechnet.

  - title: Zusammenfassung
    beats:
      - card:
          kicker: Zusammenfassung
          title: Aufräumen, dann rechnen
          list:
            - Große Beträge unter „Übrige Einkäufe“ anschauen
            - Falsches neu zuordnen, ohne Umsatz: Kreuz
            - Einkauf durch Rezept gibt Portionen
            - Portionen mal Preis gibt Umsatz
        say: >-
          Das war's. Zuerst unter Übrige Einkäufe die großen Beträge anschauen, was
          falsch zugeordnet ist, gleich rechts richtig zuordnen, und was keinen Umsatz
          bringt, mit dem Kreuz nach unten schicken. Und gerechnet wird dann ganz
          einfach: der Einkauf durchs Rezept gibt die Portionen, und die Portionen mal
          den Preis den Umsatz.
      - card:
          kicker: Gut zu wissen
          title: Passt ein Rezept nicht?
          text: Rezepte lassen sich unter „Portionen“ anpassen.
        say: >-
          Und falls einmal ein Rezept nicht zum Betrieb passt, etwa weil die Portionen
          größer sind, dann kann man es auf der Seite Portionen für diese eine Prüfung
          anpassen. Das Programm rechnet dann gleich neu.
