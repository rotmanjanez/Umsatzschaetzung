site_name: Umsatzschätzung
site_url: https://docs.umsatzschaetzung.amtstools.de/
docs_dir: pages
site_dir: site
not_in_nav: |
  /vorlagen.md

theme:
  name: material
  language: de
  font: false
  custom_dir: overrides
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Helles Design

plugins:
  - search:
      lang: de
  - llmstxt:
      preprocess: llmstxt.py
      markdown_description: >-
        Umsatzschätzung ist ein Desktop-Programm für Windows und macOS, das aus den
        Eingangsrechnungen eines Betriebs, etwa eines Gasthauses, nachrechnet, welchen
        Umsatz er mit seinem Einkauf hätte machen müssen, und diesen dem erklärten Umsatz
        gegenüberstellt. Es liest E-Rechnungen und Scans, ordnet Rechnungspositionen Zutaten
        zu, rechnet über Rezepte, Ertragsregeln und Verkaufspreise den Umsatz und belegt
        jede Zahl im Bericht bis zur Rechnungszeile. Die Dokumentation ist deutsch.
      full_output: llms-full.txt
      sections:
        Start:
          - index.md: Überblick und Ablauf einer Prüfung
        Programm:
          - pruefungen.md: Liste der Prüfungen, anlegen, öffnen, löschen, wo eine Prüfung liegt
          - pruefung.md: Eckdaten, Zeitraum, erklärter Umsatz, Bestand und Gewerbekennzahl
          - rechnungen.md: E-Rechnungen und Scans einlesen, Formate, Durchsicht und Korrektur
          - zuordnung.md: Rechnungspositionen Zutaten zuordnen, Vorschläge, Sicherheit und Faktor
          - kalkulation.md: Rechenweg vom Einkauf über Ertragsregeln, Rezepte und Preise zum Umsatz
          - bericht.md: Aufbau des Berichts, Hinweise, Richtsatzvergleich und PDF
        Grundlagen:
          - regeln.md: Zutaten, Produkte, Rezepte und Ertragsregeln, die für alle Prüfungen gelten
          - import-export.md: Prüfungen weitergeben, Sortiment als Tabelle, Rechnung als CSV
          - verwaltung.md: Für die IT, Datenablage, gemeinsame Regel-Datenbank, unbeaufsichtigte Installation und Gruppenrichtlinien
          - datenschutz.md: Für IT und Datenschutz, wo Daten liegen, Löschung, Netzwerk, Signatur und Modelle
          - vorlagen.md: Für die IT, Berichtsvorlagen anpassen, Aufbau, Daten und Filter
        Hilfe:
          - faq.md: Häufige Fragen, nach Arbeitsschritt geordnet
          - hilfe/csv.md: Was eine CSV-Datei ist und wie man sie öffnet und bearbeitet
        Beispielprüfung:
          - guide/index.md: Schritt-für-Schritt-Anleitung durch eine vollständige Prüfung eines Gasthauses
          - guide/install-macos.md: Voraussetzungen und Installation unter macOS
          - guide/install-windows.md: Voraussetzungen und Installation unter Windows
          - guide/start.md: Die erste Prüfung anlegen
          - guide/rechnungen.md: Die Beispielrechnungen herunterladen und importieren
          - guide/korrektur.md: Falsch gelesene Scans korrigieren
          - guide/zuordnung.md: Offene Zuordnungen nachholen und Faktoren ergänzen
          - guide/sortiment.md: Das Sortiment mit Verkaufspreisen anlegen
          - guide/kalkulation.md: Übrige Einkäufe aufräumen und das Ergebnis prüfen
          - guide/bericht.md: Vorschau prüfen und den Bericht als PDF speichern
          - guide/danach.md: Was für die nächste eigene Prüfung gut zu wissen ist

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/umsatzschaetzung.css

extra_javascript:
  - javascripts/umsatzschaetzung.js

markdown_extensions:
  - admonition
  - footnotes
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences

nav:
  - Start: index.md
  - Programm:
      - Prüfungen: pruefungen.md
      - Prüfung: pruefung.md
      - Rechnungen importieren: rechnungen.md
      - Zuordnung: zuordnung.md
      - Kalkulation: kalkulation.md
      - Bericht: bericht.md
  - Grundlagen:
      - Regeln: regeln.md
      - Import und Export: import-export.md
      - Verwaltete Installation: verwaltung.md
      - Sicherheit und Datenschutz: datenschutz.md
  - Hilfe:
      - Häufige Fragen: faq.md
      - CSV-Dateien: hilfe/csv.md
  - Beispielprüfung:
      - guide/index.md
      - Installation:
          - macOS: guide/install-macos.md
          - Windows: guide/install-windows.md
      - Prüfung anlegen: guide/start.md
      - 1. Rechnungen:
          - Importieren: guide/rechnungen.md
          - Korrigieren: guide/korrektur.md
      - 2. Zuordnung: guide/zuordnung.md
      - 3. Sortiment: guide/sortiment.md
      - 4. Kalkulation: guide/kalkulation.md
      - 5. Bericht: guide/bericht.md
      - Danach: guide/danach.md
