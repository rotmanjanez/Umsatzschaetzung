site_name: Umsatzschätzung
site_url: https://docs.umsatzschaetzung.amtstools.de/
docs_dir: pages
site_dir: site

theme:
  name: material
  language: de
  font: false
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dunkles Design
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Helles Design

plugins:
  - search:
      lang: de

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/umsatzschaetzung.css

extra_javascript:
  - javascripts/umsatzschaetzung.js

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences

nav:
  - Start: index.md
  - Programm:
      - Prüfungen: pruefungen.md
      - Prüfung: pruefung.md
      - Rechnungen importieren: rechnungen.md
      - Zuordnung: zuordnung.md
      - Kalkulation: kalkulation.md
      - Bericht: bericht.md
  - Grundlagen:
      - Regeln: regeln.md
      - Import und Export: import-export.md
  - Beispielprüfung:
      - guide/index.md
      - Installation:
          - macOS: guide/install-macos.md
          - Windows: guide/install-windows.md
      - Prüfung anlegen: guide/start.md
      - 1. Rechnungen:
          - Importieren: guide/rechnungen.md
          - Korrigieren: guide/korrektur.md
      - 2. Zuordnung: guide/zuordnung.md
      - 3. Sortiment: guide/sortiment.md
      - 4. Kalkulation: guide/kalkulation.md
      - 5. Bericht: guide/bericht.md
      - Danach: guide/danach.md
