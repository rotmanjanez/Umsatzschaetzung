{% extends "base.html" %}

{% block outdated %}

  <a href="{{ '../' ~ base_url }}">
    <strong>Zur aktuellen Fassung wechseln</strong>
  </a>
{% endblock %}

{% block site_nav %}

          {% include "partials/nav.html" %}
        </div>
      </div>
    </div>
  {% endif %}
{% endblock %}
